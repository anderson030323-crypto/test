name: Daily TPE→DPS fare monitor

on:
  schedule:
    # 09:00 Asia/Taipei (UTC+8) == 01:00 UTC, every day
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      notify_always:
        description: "Send a notification even if there is no new low"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: flight-monitor
  cancel-in-progress: false

jobs:
  check-fares:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check fares
        env:
          # --- search settings (override via repo Variables) ---
          # Prices come from Google Flights via fast-flights; no API key needed.
          MAX_STOPS: ${{ vars.MAX_STOPS || '' }}
          GOOGLE_FLIGHTS_PROXY: ${{ secrets.GOOGLE_FLIGHTS_PROXY }}
          DEBUG_DIR: debug-html
          ORIGIN: ${{ vars.ORIGIN || 'TPE' }}
          DESTINATION: ${{ vars.DESTINATION || 'DPS' }}
          CURRENCY: ${{ vars.CURRENCY || 'TWD' }}
          ADULTS: ${{ vars.ADULTS || '1' }}
          DEPARTURE_DATES: ${{ vars.DEPARTURE_DATES || '2027-02-02,2027-02-03' }}
          RETURN_DATES: ${{ vars.RETURN_DATES || '2027-02-08,2027-02-09' }}
          AIRLINES: ${{ vars.AIRLINES || 'BR,CI,CX,JX,EK' }}
          TRIP_NIGHTS: ${{ vars.TRIP_NIGHTS || '5' }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD || '30,45,60,90' }}
          NOTIFY_ALWAYS: ${{ inputs.notify_always || vars.NOTIFY_ALWAYS || 'false' }}
          # --- notifications ---
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Email (primary): Gmail address + App Password used to send
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO || 'anderson030323@gmail.com' }}
        run: python monitor/flight_monitor.py

      - name: Upload debug HTML (pages that yielded no results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug-html/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit price history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price_history.json
          if git diff --cached --quiet; then
            echo "No history changes."
            exit 0
          fi
          git commit -m "chore: record fares $(TZ=Asia/Taipei date +%F)"
          # GitHub occasionally rejects a push transiently; retry a few times.
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push failed (attempt $i), retrying..."
            sleep $((i * 10))
          done
          exit 1
